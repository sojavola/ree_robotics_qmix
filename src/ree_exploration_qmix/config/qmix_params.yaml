# Paramètres QMIX
qmix:
  # Fréquence de décision des agents (Hz)
  decision_hz: 50.0
  # Paramètres d'entraînement
  gamma: 0.995
  learning_rate: 0.00001     # 5e-6 → 1e-5 : batch_size=32 donne des gradients plus stables → LR peut remonter.
  buffer_size: 300           # 80 → 300 : serveur 35GB libre — 75MB/ep × 300 = 22GB OK.
  batch_size: 32             # 8 → 32 : RAM serveur suffisante, gradients 4× plus stables.
  target_update_freq: 300    # 150 → 300 : train_freq 2× plus fréquent → compense pour garder la même
                             # fréquence de mise à jour du réseau cible (toutes les ~1500 experiences).
  train_freq: 5              # 10 → 5 : entraîne 2× plus souvent.
  num_updates: 4             # gradient steps par déclenchement (équivalent N_EPOCHS=4 PPO).
  grad_clip: 1.0
  n_steps: 8                 # 5 → 8 : meilleur signal TD à long terme sur machine rapide.

  # Paramètres d'exploration
  epsilon_start: 1.0
  epsilon_end: 0.10          # 0.05→0.10 : plancher permanent d'exploration (évite collapse quand epsilon=0)
  epsilon_decay: 25000       # 9000 → 25000 : 20Hz → ~240 ep/heure → decay jusqu'à ep ~4000.

  # Architecture réseau
  hidden_dim: 64
  hyper_dim: 64

  # Dimensions de l'environnement
  map_width: 100
  map_height: 100
  num_actions: 8
  num_robots: 4

  # Coverage bonus (remplace Geo-ICM)
  # r_coverage = coverage_weight par nouvelle cellule visitée dans l'épisode
  coverage_weight: 0.5

  # Capteur
  sensor_noise_std: 0.02

  # Multi-Scale
  use_multi_scale: true
  regional_obs_size: 60
  regional_scale: 3

  # Communication
  use_comm: false
  comm_dim: 32
  num_comm_rounds: 1

  # Topics ROS
  topics:
    mineral_map: "/mineral_map"
    obstacle_map: "/obstacle_map"
    agent_exp: "/agent_experience"
    trainer_update: "/qmix/weight_update"
    trainer_epsilon: "/qmix/epsilon"
    comm: "/qmix/comm"
