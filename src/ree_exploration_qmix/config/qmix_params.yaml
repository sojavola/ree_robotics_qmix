# Paramètres QMIX
qmix:
  # Paramètres d'entraînement
  gamma: 0.995
  learning_rate: 0.000005    # 1e-5 → 5e-6 : loss à 17 → chaque update trop grand.
                             # Halver le LR réduit l'amplitude des corrections mal dirigées.
                             # Re-augmenter à 1e-5 quand loss < 5 stabilisé.
  buffer_size: 80            # 200→80 : RAM fix — avec regional_maps (float16 : 75 MB/ep), 200 ep = 15 GB → OOM.
                             # 80 ep × 75 MB = 6 GB (+ PyTorch ~1 GB + ROS2 ~2 GB = ~9 GB / 16 GB dispo).
                             # Pour catastrophic forgetting : batch diversifié via epsilon_decay=9000 + train_freq=10.
  batch_size: 8              # 16→8 : batch_size=16 créait ~2 Go de tenseurs par step
                             # → training step 134s → CPU starvation → robots à 0.01 steps/s
                             # → watchdog loop → 0 épisodes. Retour à 8 (step ~67s).
  target_update_freq: 150    # 50→150 : réseau cible mis à jour moins souvent.
                             # Empêche le réseau cible de suivre les Q-values divergentes.
                             # Targets stables = signal TD plus propre = loss qui descend.
  train_freq: 10
  grad_clip: 1.0
  n_steps: 5

  # Paramètres d'exploration
  epsilon_start: 1.0
  epsilon_end: 0.10          # 0.05→0.10 : plancher permanent d'exploration (évite collapse quand epsilon=0)
  epsilon_decay: 9000        # 4000→9000 : decay jusqu'à ep ~1550 (était ep ~690 → collapse confirmé)

  # Architecture réseau
  hidden_dim: 64
  hyper_dim: 64

  # Dimensions de l'environnement
  map_width: 100
  map_height: 100
  num_actions: 8
  num_robots: 4

  # Coverage bonus (remplace Geo-ICM)
  # r_coverage = coverage_weight par nouvelle cellule visitée dans l'épisode
  coverage_weight: 0.5

  # Capteur
  sensor_noise_std: 0.02

  # Multi-Scale
  use_multi_scale: true
  regional_obs_size: 60
  regional_scale: 3

  # Communication
  use_comm: false
  comm_dim: 32
  num_comm_rounds: 1

  # Topics ROS
  topics:
    mineral_map: "/mineral_map"
    obstacle_map: "/obstacle_map"
    agent_exp: "/agent_experience"
    trainer_update: "/qmix/weight_update"
    trainer_epsilon: "/qmix/epsilon"
    comm: "/qmix/comm"
